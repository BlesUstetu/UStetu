name: Base Sepolia Deployment Dry Run

on:
  workflow_dispatch:
    inputs:
      deployer_address:
        description: "Public deployer address used only for simulation"
        required: true
        default: "0x4C415aEAeD847B0f28a7637f784082EA76DeBff1"
        type: string

jobs:
  simulate:
    name: Simulate UStetu V1 on Base Sepolia
    runs-on: ubuntu-latest
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      USTETU_FEE_RECIPIENT: 0x393c8Ab9FA306D0e3631AA9e027B467c61d7Bc29
      DEPLOYER_ADDRESS: ${{ inputs.deployer_address }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@v1.9.7

      - name: Compile
        run: forge build

      - name: Simulate deployment
        run: |
          forge script script/DeployBaseSepoliaDryRun.s.sol:DeployBaseSepoliaDryRun             --rpc-url "$BASE_SEPOLIA_RPC_URL"             -vvvv
