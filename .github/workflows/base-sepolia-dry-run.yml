name: Base Sepolia Deployment Dry Run

on:
  workflow_dispatch:

jobs:
  simulate:
    name: Simulate UStetu V1 on Base Sepolia
    runs-on: ubuntu-latest

    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      DEPLOYER_ADDRESS: "0x4C415aEAeD847B0f28a7637f784082EA76DeBff1"
      USTETU_FEE_RECIPIENT: "0x393c8Ab9FA306D0e3631AA9e027B467c61d7Bc29"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vv

      - name: Simulate deployment
        run: forge script script/DeployBaseSepoliaDryRun.s.sol:DeployBaseSepoliaDryRun --rpc-url "$BASE_SEPOLIA_RPC_URL" -vvvv
