name: Base Sepolia Deployment Dry Run

on:
  workflow_dispatch:

jobs:
  simulate:
    name: Simulate UStetu V1 on Base Sepolia
    runs-on: ubuntu-latest
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      USTETU_FEE_RECIPIENT: 0x393c8Ab9FA306D0e3631AA9e027B467c61d7Bc29
      DEPLOYER_PRIVATE_KEY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@v1.9.7

      - name: Compile
        run: forge build

      - name: Simulate deployment
        run: |
          forge script script/DeployBaseSepolia.s.sol:DeployBaseSepolia             --rpc-url "$BASE_SEPOLIA_RPC_URL"             -vvvv
