name: UStetu listing indexer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ustetu-listing-indexer
  cancel-in-progress: false

jobs:
  index:
    name: Scan Base listing events
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing repository Actions secret CRON_SECRET."
            exit 1
          fi

      - name: Call production indexer
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --location --max-redirs 3 --max-time 75 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.ustetu.dev/api/indexer/cron")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat "$response_file"
            echo "::error::Indexer returned HTTP $status."
            exit 1
          fi
          if ! jq -e '.ok == true' "$response_file" >/dev/null; then
            cat "$response_file"
            echo "::error::Indexer response was not successful."
            exit 1
          fi
          cat "$response_file"
