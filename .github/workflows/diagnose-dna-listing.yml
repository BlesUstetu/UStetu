name: Diagnose DNA Listing On Base
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-dna-listing.yml"
      - "frontend/scripts/diagnose-dna-listing.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Read Escrow and Registry state on Base Mainnet
        working-directory: frontend
        run: node scripts/diagnose-dna-listing.mjs
