name: Deploy UStetu V1 to Base Mainnet

on:
  workflow_dispatch:
    inputs:
      fee_recipient:
        description: "Immutable UStetu fee recipient"
        required: true
        default: "0x393c8Ab9FA306D0e3631AA9e027B467c61d7Bc29"
        type: string
      confirm:
        description: "Type DEPLOY_BASE_MAINNET to authorize the broadcast"
        required: true
        type: string

jobs:
  deploy:
    name: Broadcast UStetu V1 deployment
    runs-on: ubuntu-latest
    environment: production
    env:
      BASE_RPC_URL: https://mainnet.base.org
      USTETU_FEE_RECIPIENT: ${{ inputs.fee_recipient }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.USTETU_DEPLOYER_PRIVATE_KEY }}

    steps:
      - name: Verify deployment confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY_BASE_MAINNET" ]; then
            echo "Invalid deployment confirmation."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@v1.9.7

      - name: Compile
        run: forge build

      - name: Broadcast Base Mainnet deployment
        run: |
          forge script script/DeployBaseMainnet.s.sol:DeployBaseMainnet \
            --rpc-url "$BASE_RPC_URL" \
            --private-key "$DEPLOYER_PRIVATE_KEY" \
            --broadcast \
            -vvvv
