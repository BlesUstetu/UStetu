name: Prepare UStetu Mainnet Verification JSONs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ustetu-mainnet-verification
  cancel-in-progress: false

jobs:
  prepare:
    name: Compile deployment sources and package verification inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact Mainnet deployment source
        uses: actions/checkout@v4
        with:
          ref: bbc8ab3a3b6daeeaa4f5baddb4925db7025c4c3e
          submodules: recursive
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Install pinned forge-std
        run: forge install foundry-rs/forge-std@v1.9.7

      - name: Confirm deployment build configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^solc_version = "0\\.8\\.30"$' foundry.toml
          grep -Eq '^optimizer = true$' foundry.toml
          grep -Eq '^optimizer_runs = 200$' foundry.toml
          test -f contracts/core/UStetuRegistry.sol
          test -f contracts/core/UStetuSellerRegistry.sol
          test -f contracts/core/UStetuEscrow.sol
          echo "Pinned deployment source and Solidity 0.8.30 / optimizer 200 configuration confirmed."

      - name: Compile with build information
        run: forge build --build-info

      - name: Extract and validate all three Standard JSON inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          targets = [
              {
                  "file": "contracts/core/UStetuRegistry.sol",
                  "contract": "UStetuRegistry",
                  "address": "0x237023EC6A39e59CEbd1D231777308c354ba542F",
              },
              {
                  "file": "contracts/core/UStetuSellerRegistry.sol",
                  "contract": "UStetuSellerRegistry",
                  "address": "0x2e8512a3c9953E5B2f061a4FF694637f78740468",
              },
              {
                  "file": "contracts/core/UStetuEscrow.sol",
                  "contract": "UStetuEscrow",
                  "address": "0x0ffE00bAe47d6b4AD9d6A12ec649dd8866f130ae",
              },
          ]

          build_infos = []
          for path in Path("out/build-info").glob("*.json"):
              info = json.loads(path.read_text())
              build_infos.append((path, info))

          summaries = []
          for target in targets:
              candidates = []
              for path, info in build_infos:
                  contracts = info.get("output", {}).get("contracts", {})
                  if target["contract"] in contracts.get(target["file"], {}):
                      candidates.append((path, info))

              if len(candidates) != 1:
                  raise SystemExit(
                      f'Expected exactly one build-info entry for {target["file"]}:{target["contract"]}; '
                      f'found {len(candidates)}'
                  )

              build_info_path, info = candidates[0]
              original_input = info.get("input")
              if not isinstance(original_input, dict):
                  raise SystemExit(f'No Standard JSON input for {target["contract"]}')

              settings = original_input.get("settings", {})
              optimizer = settings.get("optimizer", {})
              if optimizer.get("enabled") is not True or optimizer.get("runs") != 200:
                  raise SystemExit(f'Unexpected optimizer settings for {target["contract"]}: {optimizer}')
              if settings.get("evmVersion") != "osaka":
                  raise SystemExit(
                      f'Unexpected EVM version for {target["contract"]}: {settings.get("evmVersion")}; expected osaka'
                  )
              if info.get("solcVersion") != "0.8.30":
                  raise SystemExit(
                      f'Unexpected compiler version for {target["contract"]}: {info.get("solcVersion")}'
                  )
              if target["file"] not in original_input.get("sources", {}):
                  raise SystemExit(f'Missing source {target["file"]}')

              # Keep only Solidity Standard JSON top-level fields.
              standard_input = {
                  "language": original_input["language"],
                  "sources": original_input["sources"],
                  "settings": original_input["settings"],
              }
              filename = target["contract"] + ".standard-input.json"
              Path(filename).write_text(json.dumps(standard_input, separators=(",", ":")) + "\n")

              summary = {
                  "contractAddress": target["address"],
                  "chainId": 8453,
                  "contractFile": target["file"],
                  "contractName": target["contract"],
                  "compilerVersion": info["solcVersion"],
                  "optimizer": optimizer,
                  "evmVersion": settings["evmVersion"],
                  "deploymentSourceCommit": "bbc8ab3a3b6daeeaa4f5baddb4925db7025c4c3e",
                  "foundryVersion": "1.8.3",
                  "buildInfoFile": str(build_info_path),
                  "sourceCount": len(standard_input["sources"]),
                  "standardJsonTopLevelKeys": list(standard_input.keys()),
              }
              Path(target["contract"] + ".build-info-summary.json").write_text(
                  json.dumps(summary, indent=2) + "\\n"
              )
              summaries.append(summary)

          print(json.dumps(summaries, indent=2))
          PY

      - name: Upload verification artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ustetu-mainnet-verification
          path: |
            UStetuRegistry.standard-input.json
            UStetuRegistry.build-info-summary.json
            UStetuSellerRegistry.standard-input.json
            UStetuSellerRegistry.build-info-summary.json
            UStetuEscrow.standard-input.json
            UStetuEscrow.build-info-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish artifact location
        shell: bash
        run: |
          {
            echo "## UStetu Mainnet verification inputs"
            echo ""
            echo "Generated from the exact Mainnet deployment source commit. No deployment or on-chain transaction was performed."
            echo ""
            echo "[Download workflow artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }})"
            echo ""
            echo "Artifact ID: ${{ steps.upload.outputs.artifact-id }}"
          } >> "$GITHUB_STEP_SUMMARY"
